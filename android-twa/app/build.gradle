plugins {
    id 'com.android.application'
}

android {
    namespace 'app.swipego.lcbconnect'
    compileSdk 34

    defaultConfig {
        applicationId "app.swipego.lcbconnect"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    signingConfigs {
        release {
            storeFile file("../keystore.jks")
            storePassword "lcbconnect2026"
            keyAlias "lcbconnect"
            keyPassword "lcbconnect2026"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
